<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSTN | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">JSTN<span>.</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>


<main class="inner-page">

    <div class="page-number">
        03 / CONTACT
    </div>


    <section class="contact-layout">

        <div>

            <p class="label">GET IN TOUCH</p>

            <h1>
                Let's<br>
                <span>connect.</span>
            </h1>

            <p class="contact-description">
                Have a question or simply want
                to say hello? Send me a message.
            </p>

        </div>


        <form>

            <label>Name</label>
            <input
                type="text"
                placeholder="Your name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                placeholder="Your email"
                required
            >

            <label>Message</label>
            <textarea
                rows="6"
                placeholder="Write your message..."
                required
            ></textarea>

            <button type="submit">
                Send Message →
            </button>

        </form>

    </section>

</main>


<footer>
    <p>© 2026 JSTN</p>
    <p>Contact Justine</p>
</footer>

</body>
</html>
